name: Database RLS Testing - Automated CI/CD Pipeline

# Author: Aisha Kamau - Senior QA Engineer
# Date: 2025-10-04 (Day 2)
# Purpose: Automated RLS policy testing on Pull Requests
# Integration: Marcus RLS implementation + Raj Docker environment

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'database/**'
      - '.github/workflows/database-tests.yml'
  push:
    branches: [ main, develop ]
    paths:
      - 'database/**'

  # Allow manual workflow trigger
  workflow_dispatch:

env:
  POSTGRES_DB: taifabase_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_PORT: 5432

jobs:
  database-rls-tests:
    name: RLS Policy Validation & Performance Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15.8
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install asyncpg pytest pytest-asyncio pytest-cov

      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready!"

      - name: Initialize database schema
        run: |
          PGPASSWORD=${{ env.POSTGRES_PASSWORD }} psql -h localhost -p 5432 -U postgres -d taifabase_test -f database/scripts/01_init_database.sql
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}

      - name: Load test data
        run: |
          if [ -f database/scripts/02_test_data.sql ]; then
            PGPASSWORD=${{ env.POSTGRES_PASSWORD }} psql -h localhost -p 5432 -U postgres -d taifabase_test -f database/scripts/02_test_data.sql
          else
            echo "Test data file not found, skipping..."
          fi
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}

      - name: Implement RLS policies
        run: |
          PGPASSWORD=${{ env.POSTGRES_PASSWORD }} psql -h localhost -p 5432 -U postgres -d taifabase_test -f database/scripts/03_rls_implementation.sql
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}

      - name: Set up RLS test environment
        run: |
          PGPASSWORD=${{ env.POSTGRES_PASSWORD }} psql -h localhost -p 5432 -U postgres -d taifabase_test -f database/testing/frameworks/rls_test_config.sql
          PGPASSWORD=${{ env.POSTGRES_PASSWORD }} psql -h localhost -p 5432 -U postgres -d taifabase_test -f database/testing/frameworks/rls_test_functions.sql
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}

      - name: Run RLS automated tests
        id: rls_tests
        run: |
          python database/testing/scripts/rls_test_runner.py
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: taifabase_test
          DB_USER: postgres
          DB_PASSWORD: postgres
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rls-test-results
          path: database/testing/results/
          retention-days: 30

      - name: Upload performance baseline
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-baseline
          path: database/testing/results/performance_baseline.json
          retention-days: 90

      - name: Parse test results
        id: parse_results
        if: always()
        run: |
          if [ -f database/testing/results/rls_test_report.json ]; then
            PASS_RATE=$(python3 -c "import json; data=json.load(open('database/testing/results/rls_test_report.json')); print(data['overall_results']['pass_rate_percent'])")
            TOTAL_TESTS=$(python3 -c "import json; data=json.load(open('database/testing/results/rls_test_report.json')); print(data['overall_results']['total_tests'])")
            PASSED_TESTS=$(python3 -c "import json; data=json.load(open('database/testing/results/rls_test_report.json')); print(data['overall_results']['passed_tests'])")
            FAILED_TESTS=$(python3 -c "import json; data=json.load(open('database/testing/results/rls_test_report.json')); print(data['overall_results']['failed_tests'])")

            echo "pass_rate=$PASS_RATE" >> $GITHUB_OUTPUT
            echo "total_tests=$TOTAL_TESTS" >> $GITHUB_OUTPUT
            echo "passed_tests=$PASSED_TESTS" >> $GITHUB_OUTPUT
            echo "failed_tests=$FAILED_TESTS" >> $GITHUB_OUTPUT

            echo "### Test Results Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Total Tests**: $TOTAL_TESTS" >> $GITHUB_STEP_SUMMARY
            echo "- **Passed**: $PASSED_TESTS" >> $GITHUB_STEP_SUMMARY
            echo "- **Failed**: $FAILED_TESTS" >> $GITHUB_STEP_SUMMARY
            echo "- **Pass Rate**: $PASS_RATE%" >> $GITHUB_STEP_SUMMARY
          else
            echo "Test results file not found!"
            exit 1
          fi

      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            if (!fs.existsSync('database/testing/results/rls_test_report.json')) {
              console.log('Test results not found');
              return;
            }

            const results = JSON.parse(fs.readFileSync('database/testing/results/rls_test_report.json', 'utf8'));
            const overall = results.overall_results;

            const statusEmoji = overall.test_status === 'PASS' ? '✅' : overall.test_status === 'WARNING' ? '⚠️' : '❌';

            let comment = `## ${statusEmoji} RLS Testing Results\n\n`;
            comment += `### Overall Summary\n`;
            comment += `- **Total Tests**: ${overall.total_tests}\n`;
            comment += `- **Passed**: ${overall.passed_tests}\n`;
            comment += `- **Failed**: ${overall.failed_tests}\n`;
            comment += `- **Pass Rate**: ${overall.pass_rate_percent}%\n`;
            comment += `- **Status**: ${overall.test_status}\n`;
            comment += `- **Avg Execution Time**: ${overall.avg_execution_time_ms}ms\n\n`;

            comment += `### Results by Category\n\n`;
            comment += `| Category | Passed | Failed | Total | Pass Rate |\n`;
            comment += `|----------|--------|--------|-------|----------|\n`;

            for (const [category, stats] of Object.entries(results.results_by_category)) {
              comment += `| ${category} | ${stats.passed_tests} | ${stats.failed_tests} | ${stats.total_tests} | ${stats.pass_rate_percent}% |\n`;
            }

            if (results.failed_tests && results.failed_tests.length > 0) {
              comment += `\n### Failed Tests\n\n`;
              results.failed_tests.forEach(test => {
                comment += `- **${test.test_name}**: ${test.error_message || 'Test assertion failed'}\n`;
              });
            }

            comment += `\n---\n`;
            comment += `*Automated RLS Testing by Aisha Kamau - QA Engineer (US-104)*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Check test pass rate threshold
        if: always()
        run: |
          if [ -f database/testing/results/rls_test_report.json ]; then
            PASS_RATE=$(python3 -c "import json; data=json.load(open('database/testing/results/rls_test_report.json')); print(data['overall_results']['pass_rate_percent'])")

            echo "Test pass rate: $PASS_RATE%"

            # Fail the workflow if pass rate is below 80%
            if (( $(echo "$PASS_RATE < 80" | bc -l) )); then
              echo "❌ Test pass rate ($PASS_RATE%) is below required threshold (80%)"
              exit 1
            elif (( $(echo "$PASS_RATE < 95" | bc -l) )); then
              echo "⚠️ Test pass rate ($PASS_RATE%) is acceptable but below optimal (95%)"
              exit 0
            else
              echo "✅ Test pass rate ($PASS_RATE%) meets quality standards"
              exit 0
            fi
          else
            echo "❌ Test results not found - failing workflow"
            exit 1
          fi

  performance-regression-check:
    name: Performance Regression Detection
    runs-on: ubuntu-latest
    needs: database-rls-tests
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: performance-baseline
          path: database/testing/results/

      - name: Check for performance regression
        run: |
          if [ -f database/testing/results/performance_baseline.json ]; then
            echo "### Performance Metrics" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            python3 -c "
import json
baseline = json.load(open('database/testing/results/performance_baseline.json'))
print(f\"- COUNT avg: {baseline.get('count_avg_ms', 'N/A')}ms\")
print(f\"- SELECT avg: {baseline.get('select_avg_ms', 'N/A')}ms\")
print(f\"- Timestamp: {baseline.get('timestamp', 'N/A')}\")
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "No performance baseline found (first run - baseline established)"
          fi

  security-validation:
    name: Security & Compliance Checks
    runs-on: ubuntu-latest
    needs: database-rls-tests
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: rls-test-results
          path: database/testing/results/

      - name: Validate security test results
        run: |
          if [ -f database/testing/results/rls_test_report.json ]; then
            SECURITY_PASSED=$(python3 -c "import json; data=json.load(open('database/testing/results/rls_test_report.json')); print(data['results_by_category'].get('security', {}).get('passed_tests', 0))")
            SECURITY_FAILED=$(python3 -c "import json; data=json.load(open('database/testing/results/rls_test_report.json')); print(data['results_by_category'].get('security', {}).get('failed_tests', 0))")

            echo "### Security Test Results" >> $GITHUB_STEP_SUMMARY
            echo "- Passed: $SECURITY_PASSED" >> $GITHUB_STEP_SUMMARY
            echo "- Failed: $SECURITY_FAILED" >> $GITHUB_STEP_SUMMARY

            if [ "$SECURITY_FAILED" -gt "0" ]; then
              echo "❌ Security tests failed - blocking deployment"
              exit 1
            else
              echo "✅ All security tests passed"
            fi
          fi

  load-testing:
    name: Load Testing (1000+ concurrent users)
    runs-on: ubuntu-latest
    needs: database-rls-tests
    # Only run load tests when PR has 'load-test' label (prevents slow CI on every commit)
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'load-test')
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install k6 load testing tool
        run: |
          wget -q https://github.com/grafana/k6/releases/download/v0.47.0/k6-v0.47.0-linux-amd64.tar.gz
          tar -xzf k6-v0.47.0-linux-amd64.tar.gz
          sudo mv k6 /usr/local/bin/
          k6 version

      - name: Validate test scripts
        run: |
          echo "Validating k6 test scripts..."
          k6 inspect database/testing/load-tests/rls-load-test.js
          k6 inspect database/testing/load-tests/pgbouncer-stress-test.js
          k6 inspect database/testing/load-tests/rls-multi-tenant-load.js

      - name: Run RLS load test (1000 concurrent users)
        id: rls_load_test
        run: |
          echo "Starting RLS load test..."
          k6 run --out json=rls-load-results.json database/testing/load-tests/rls-load-test.js
        env:
          PGBOUNCER_URL: http://localhost:5433
          DB_NAME: taifabase_dev
          DB_USER: taifabase_user
          DB_PASSWORD: taifabase_dev_password
        continue-on-error: true

      - name: Run PgBouncer stress test (1500 concurrent users)
        id: pgbouncer_stress_test
        run: |
          echo "Starting PgBouncer stress test..."
          k6 run --out json=pgbouncer-stress-results.json database/testing/load-tests/pgbouncer-stress-test.js
        env:
          PGBOUNCER_URL: http://localhost:5433
          DB_NAME: taifabase_dev
          DB_USER: taifabase_user
          DB_PASSWORD: taifabase_dev_password
        continue-on-error: true

      - name: Run multi-tenant load test
        id: multi_tenant_load_test
        run: |
          echo "Starting multi-tenant load test..."
          k6 run --out json=multi-tenant-load-results.json database/testing/load-tests/rls-multi-tenant-load.js
        env:
          PGBOUNCER_URL: http://localhost:5433
          DB_NAME: taifabase_dev
          DB_USER: taifabase_user
          DB_PASSWORD: taifabase_dev_password
        continue-on-error: true

      - name: Upload load test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-results
          path: |
            rls-load-results.json
            pgbouncer-stress-results.json
            multi-tenant-load-results.json
          retention-days: 30

      - name: Parse and validate load test results
        if: always()
        run: |
          echo "### Load Testing Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # RLS Load Test
          if [ -f rls-load-results.json ]; then
            echo "#### RLS Load Test (1000 users)" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            python3 -c "
import json
import sys

try:
    with open('rls-load-results.json') as f:
        data = json.load(f)

    metrics = data.get('metrics', {})
    thresholds = data.get('thresholds', {})

    # Extract key metrics
    http_reqs = metrics.get('http_reqs', {}).get('values', {}).get('count', 0)
    http_failed = metrics.get('http_req_failed', {}).get('values', {}).get('rate', 0)
    success_rate = (1 - http_failed) * 100

    print(f'Total Requests: {http_reqs}')
    print(f'Success Rate: {success_rate:.2f}%')

    # Check thresholds
    all_passed = all(t.get('ok', False) for t in thresholds.values())
    print(f'Thresholds: {\"✓ PASSED\" if all_passed else \"✗ FAILED\"}')

except Exception as e:
    print(f'Error parsing results: {e}')
            " >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # PgBouncer Stress Test
          if [ -f pgbouncer-stress-results.json ]; then
            echo "#### PgBouncer Stress Test (1500 users)" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            python3 -c "
import json
import sys

try:
    with open('pgbouncer-stress-results.json') as f:
        data = json.load(f)

    metrics = data.get('metrics', {})
    thresholds = data.get('thresholds', {})

    http_reqs = metrics.get('http_reqs', {}).get('values', {}).get('count', 0)
    http_failed = metrics.get('http_req_failed', {}).get('values', {}).get('rate', 0)
    success_rate = (1 - http_failed) * 100

    print(f'Total Transactions: {http_reqs}')
    print(f'Success Rate: {success_rate:.2f}%')

    all_passed = all(t.get('ok', False) for t in thresholds.values())
    print(f'Thresholds: {\"✓ PASSED\" if all_passed else \"✗ FAILED\"}')

except Exception as e:
    print(f'Error parsing results: {e}')
            " >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # Multi-tenant Load Test
          if [ -f multi-tenant-load-results.json ]; then
            echo "#### Multi-Tenant Load Test" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            python3 -c "
import json
import sys

try:
    with open('multi-tenant-load-results.json') as f:
        data = json.load(f)

    metrics = data.get('metrics', {})
    thresholds = data.get('thresholds', {})

    leakage = metrics.get('data_leakage_violations', {}).get('values', {}).get('count', -1)
    isolation = metrics.get('tenant_isolation_success', {}).get('values', {}).get('rate', 0) * 100

    print(f'Data Leakage Violations: {leakage}')
    print(f'Tenant Isolation: {isolation:.2f}%')

    all_passed = all(t.get('ok', False) for t in thresholds.values())
    print(f'Thresholds: {\"✓ PASSED\" if all_passed else \"✗ FAILED\"}')

    if leakage == 0:
        print('✓ SECURITY: Perfect tenant isolation')
    else:
        print('✗ SECURITY: Data leakage detected!')

except Exception as e:
    print(f'Error parsing results: {e}')
            " >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comment PR with load test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let comment = '## 📊 Load Testing Results\n\n';
            comment += '*Load tests validate system performance under production-level concurrent load*\n\n';

            // RLS Load Test Results
            if (fs.existsSync('rls-load-results.json')) {
              const rlsData = JSON.parse(fs.readFileSync('rls-load-results.json', 'utf8'));
              const metrics = rlsData.metrics || {};
              const thresholds = rlsData.thresholds || {};

              const httpReqs = metrics.http_reqs?.values?.count || 0;
              const httpFailed = metrics.http_req_failed?.values?.rate || 0;
              const successRate = ((1 - httpFailed) * 100).toFixed(2);
              const allPassed = Object.values(thresholds).every(t => t.ok);

              const status = allPassed ? '✅' : '❌';

              comment += `### ${status} RLS Load Test (1000 concurrent users)\n`;
              comment += `- **Total Requests**: ${httpReqs.toLocaleString()}\n`;
              comment += `- **Success Rate**: ${successRate}%\n`;
              comment += `- **Status**: ${allPassed ? 'PASSED' : 'FAILED'}\n\n`;
            }

            // PgBouncer Stress Test Results
            if (fs.existsSync('pgbouncer-stress-results.json')) {
              const pgData = JSON.parse(fs.readFileSync('pgbouncer-stress-results.json', 'utf8'));
              const metrics = pgData.metrics || {};
              const thresholds = pgData.thresholds || {};

              const httpReqs = metrics.http_reqs?.values?.count || 0;
              const httpFailed = metrics.http_req_failed?.values?.rate || 0;
              const successRate = ((1 - httpFailed) * 100).toFixed(2);
              const allPassed = Object.values(thresholds).every(t => t.ok);

              const status = allPassed ? '✅' : '❌';

              comment += `### ${status} PgBouncer Stress Test (1500 concurrent users)\n`;
              comment += `- **Total Transactions**: ${httpReqs.toLocaleString()}\n`;
              comment += `- **Success Rate**: ${successRate}%\n`;
              comment += `- **Status**: ${allPassed ? 'PASSED' : 'FAILED'}\n\n`;
            }

            // Multi-Tenant Load Test Results
            if (fs.existsSync('multi-tenant-load-results.json')) {
              const mtData = JSON.parse(fs.readFileSync('multi-tenant-load-results.json', 'utf8'));
              const metrics = mtData.metrics || {};
              const thresholds = mtData.thresholds || {};

              const leakage = metrics.data_leakage_violations?.values?.count || 0;
              const isolation = ((metrics.tenant_isolation_success?.values?.rate || 0) * 100).toFixed(2);
              const allPassed = Object.values(thresholds).every(t => t.ok);

              const status = leakage === 0 && allPassed ? '✅' : '❌';

              comment += `### ${status} Multi-Tenant Load Test\n`;
              comment += `- **Data Leakage Violations**: ${leakage}\n`;
              comment += `- **Tenant Isolation**: ${isolation}%\n`;
              comment += `- **Status**: ${allPassed ? 'PASSED' : 'FAILED'}\n`;

              if (leakage === 0) {
                comment += `- 🔒 **Security**: Perfect tenant isolation\n`;
              } else {
                comment += `- ⚠️ **Security**: Data leakage detected!\n`;
              }
              comment += '\n';
            }

            comment += '---\n';
            comment += '*Load Testing Framework by Aisha Kamau - QA Engineer (Day 3)*\n';
            comment += '*Add `load-test` label to run load tests on this PR*';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Check critical thresholds
        if: always()
        run: |
          # Check for data leakage (critical security violation)
          if [ -f multi-tenant-load-results.json ]; then
            LEAKAGE=$(python3 -c "import json; data=json.load(open('multi-tenant-load-results.json')); print(data.get('metrics', {}).get('data_leakage_violations', {}).get('values', {}).get('count', 0))")

            if [ "$LEAKAGE" -gt "0" ]; then
              echo "❌ CRITICAL: Data leakage detected ($LEAKAGE violations)"
              echo "Load tests failed - tenant isolation compromised"
              exit 1
            fi
          fi

          # Check if any load test completely failed
          EXIT_CODE=0

          if [ -f rls-load-results.json ]; then
            PASSED=$(python3 -c "import json; data=json.load(open('rls-load-results.json')); print(all(t.get('ok', False) for t in data.get('thresholds', {}).values()))")
            if [ "$PASSED" = "False" ]; then
              echo "❌ RLS load test thresholds failed"
              EXIT_CODE=1
            fi
          fi

          if [ -f pgbouncer-stress-results.json ]; then
            PASSED=$(python3 -c "import json; data=json.load(open('pgbouncer-stress-results.json')); print(all(t.get('ok', False) for t in data.get('thresholds', {}).values()))")
            if [ "$PASSED" = "False" ]; then
              echo "⚠️ PgBouncer stress test thresholds failed (warning only)"
              # Don't fail on PgBouncer stress test - it's expected to show limits
            fi
          fi

          if [ -f multi-tenant-load-results.json ]; then
            PASSED=$(python3 -c "import json; data=json.load(open('multi-tenant-load-results.json')); print(all(t.get('ok', False) for t in data.get('thresholds', {}).values()))")
            if [ "$PASSED" = "False" ]; then
              echo "❌ Multi-tenant load test thresholds failed"
              EXIT_CODE=1
            fi
          fi

          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ All load tests passed successfully"
          else
            echo "❌ Some load tests failed - review artifacts for details"
          fi

          exit $EXIT_CODE
