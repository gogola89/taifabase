# PostgreSQL 15 Configuration for Taifabase Development
# Optimized for development and RLS performance testing

# Basic Connection Settings
listen_addresses = '*'
port = 5432
max_connections = 200

# Memory Settings (optimized for development)
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 16MB
maintenance_work_mem = 256MB

# Checkpoints and WAL
checkpoint_completion_target = 0.9
wal_buffers = 16MB
max_wal_size = 2GB
min_wal_size = 1GB

# Query Planner
random_page_cost = 1.1
effective_io_concurrency = 200

# Logging (for development and debugging)
log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_messages = info
log_min_error_statement = error
log_min_duration_statement = 1000
log_statement = 'mod'
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# Row Level Security Settings
row_security = on

# Performance Monitoring
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all

# Development-friendly settings
log_lock_waits = on
deadlock_timeout = 1s
log_temp_files = 0

# Autovacuum tuning for development
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 20s