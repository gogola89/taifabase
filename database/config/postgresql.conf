# PostgreSQL 15 Configuration for Taifabase Development
# Optimized for development and RLS performance testing

# Basic Connection Settings
listen_addresses = '*'
port = 5432
max_connections = 200

# Memory Settings (optimized for development)
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 16MB
maintenance_work_mem = 256MB

# Checkpoints and WAL
checkpoint_completion_target = 0.9
wal_buffers = 16MB
max_wal_size = 2GB
min_wal_size = 1GB

# Query Planner
random_page_cost = 1.1
effective_io_concurrency = 200

# Logging (for development and debugging)
log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_messages = info
log_min_error_statement = error
log_min_duration_statement = 1000
log_statement = 'mod'
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# Row Level Security Settings
row_security = on

# Performance Monitoring
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all

# Development-friendly settings
log_lock_waits = on
deadlock_timeout = 1s
log_temp_files = 0

# Autovacuum tuning for development
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 20s

# SSL/TLS Configuration (Day 2 Security Hardening - CRITICAL)
# Encrypted connections prevent credential theft and data exposure
ssl = on
ssl_cert_file = '/etc/ssl/certs/server.crt'
ssl_key_file = '/etc/ssl/private/server.key'
ssl_ciphers = 'HIGH:MEDIUM:+3DES:!aNULL'
ssl_prefer_server_ciphers = on
ssl_min_protocol_version = 'TLSv1.2'

# Enhanced Audit Logging (Day 2 Security Hardening - HIGH Priority)
# Comprehensive logging for security event detection and compliance
log_statement = 'all'                    # Log all statements (SELECT, INSERT, UPDATE, DELETE, DDL)
log_connections = on                     # Log connection attempts
log_disconnections = on                  # Log disconnections
log_duration = on                        # Log statement duration
log_hostname = on                        # Log client hostname
log_line_prefix = '%t [%p] %u@%d from %h [%i] '  # Enhanced log format
log_checkpoints = on                     # Log checkpoint activity
log_lock_waits = on                      # Log lock waits (already set)
log_autovacuum_min_duration = 0          # Log all autovacuum activity
log_error_verbosity = default            # Standard error verbosity

# Security-specific logging
log_replication_commands = on            # Log replication commands
log_statement_stats = off                # Disable to reduce noise
log_parser_stats = off
log_planner_stats = off
log_executor_stats = off

# Log Rotation and Retention (Day 3 Compliance - GDPR Article 30, Article 5(1)(e))
# Automated log rotation and retention policies for compliance
log_rotation_age = 1d                     # Rotate logs daily
log_rotation_size = 100MB                 # Rotate when log reaches 100MB
log_truncate_on_rotation = off            # Preserve old logs (don't overwrite)
log_file_mode = 0600                      # Secure permissions (owner read/write only)

# Retention Policy Notes:
# - Development Environment: 90 days retention (enforced by rotate-logs.sh script)
# - Production Environment: 7 years retention (GDPR compliance requirement)
# - Automated cleanup via database/scripts/log-management/rotate-logs.sh
# - Log archival to long-term storage recommended for production