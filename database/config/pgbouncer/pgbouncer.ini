[databases]
; Database connection configuration
; Format: dbname = host=hostname port=port dbname=database
taifabase_dev = host=postgres port=5432 dbname=taifabase_dev

[pgbouncer]
; Connection pooling mode
; transaction = Connection returned to pool after transaction finishes (preserves RLS session state)
; session = Connection kept until client disconnects (full session state preserved)
; statement = Connection returned after each statement (not suitable for RLS)
pool_mode = transaction

; Network configuration
listen_addr = 0.0.0.0
listen_port = 5432
unix_socket_dir = /tmp

; Authentication settings
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Admin console access
admin_users = taifabase_user
stats_users = taifabase_user

; Connection limits
; max_client_conn: Maximum number of client connections allowed
; default_pool_size: How many server connections to allow per user/database pair
; min_pool_size: Minimum pool size per user/database pair
; reserve_pool_size: How many additional connections to allow to a pool
; max_db_connections: Do not allow more than this many server connections per database
; max_user_connections: Do not allow more than this many server connections per user
max_client_conn = 1000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 10
max_db_connections = 50
max_user_connections = 50

; Connection timeouts and lifecycle
; server_lifetime: The pooler will close an unused server connection that has been connected longer (in seconds)
; server_idle_timeout: If a server connection has been idle more than this many seconds it will be dropped
; server_connect_timeout: Maximum time allowed for connecting to backend server
; server_login_retry: If connect failed, wait this many seconds before retrying
; query_timeout: Maximum time queries are allowed to spend waiting for execution
; query_wait_timeout: Maximum time queries are allowed to spend waiting in queue
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 15
query_timeout = 0
query_wait_timeout = 120

; Session management for RLS compatibility
; server_reset_query: Query sent to server on connection release (DISCARD ALL resets session)
; This is critical for RLS to prevent session variable leakage between connections
server_reset_query = DISCARD ALL
server_check_delay = 30
server_check_query = SELECT 1

; Logging configuration
; log_connections: Log successful logins
; log_disconnections: Log disconnections with reasons
; log_pooler_errors: Log error messages pooler sends to clients
; log_stats: Write aggregated statistics to log
syslog = 0
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 1
stats_period = 60

; Security settings
; ignore_startup_parameters: Comma-separated list of parameters to ignore in startup packet
ignore_startup_parameters = extra_float_digits,application_name

; Performance tuning
; pkt_buf: Internal buffer size for packets (in bytes)
; listen_backlog: Backlog argument for listen(2)
; sbuf_loopcnt: How many times to process data on one socket before processing other sockets
; suspend_timeout: How many seconds to wait before canceling query when server connection is suspended
pkt_buf = 4096
listen_backlog = 128
sbuf_loopcnt = 5
suspend_timeout = 10

; Health and monitoring
; pidfile: PID file location
pidfile = /tmp/pgbouncer.pid

; Verbose logging for development (disable in production)
; verbose = 0 (errors only), 1 (warnings), 2 (debug)
verbose = 1

; Application name identification
application_name_add_host = 1
